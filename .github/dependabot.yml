# The workflow actions are pinned to commit SHAs (a moved tag cannot swap the code that
# runs with write access to releases), but a pinned action never updates on its own,
# security fixes included. Dependabot moves the SHA and its version comment together.
#
# Titles must pass pr-title.yml: `ci(deps): …` and `build(deps): …` are conventional, and
# release-please hides `ci` from the changelog while a borealis bump shows under "Other".

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      # `init` and `analyze` are two steps of one action and must run the same release:
      # ungrouped, Dependabot opens two PRs that each fail CodeQL on their own.
      codeql:
        patterns:
          - github/codeql-action*
      # upload-artifact and download-artifact share a storage format across majors.
      artifacts:
        patterns:
          - actions/*-artifact

  # borealis is pinned at extern/borealis and follows the `wiliwili` branch of the fork
  # (.gitmodules). Monthly: each bump changes the whole UI, so it wants a look at the
  # desktop-smoke screenshots before merging, not a weekly stream of them.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
