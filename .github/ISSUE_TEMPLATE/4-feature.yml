name: Feature request
description: Something the phone app or the console can do that PlayGuard cannot yet.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The situation and what you are trying to achieve, rather than a solution.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In the Nintendo phone app, on the console, or not at all.

  - type: textarea
    id: idea
    attributes:
      label: How PlayGuard could do it
      description: Optional. Which tab, which screen.
