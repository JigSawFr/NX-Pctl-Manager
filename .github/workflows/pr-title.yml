name: pr-title

# PRs are squash-merged, so the PR title becomes the commit message that
# release-please reads: it must be a conventional commit (feat:, fix:, …).
on:
  pull_request_target:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            style
            build
            chore
            ci
            test
            docs
            revert
            deps
            security
            change
            deprecate
            remove
