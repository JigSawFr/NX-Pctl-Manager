name: codeql

# Static analysis of the C/C++ (the service layer, the UI, the recovery sysmodule), the
# Python tools and the workflows themselves, on the pull request that introduces a problem,
# plus a weekly run so that a newly published query also finds old code. Findings land in
# the Security tab and as annotations on the PR.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '23 6 * * 4'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # The action reads its own run to attach the analysis to the right commit.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # build-mode none: C/C++ is extracted from the sources, without devkitPro. A traced
      # build would need the devkitPro container for the Switch code paths; source
      # extraction sees both the Switch and the simulated (source/sim/) paths instead.
      # extern/ (borealis) is not ours to fix, and would bury PlayGuard's own results.
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: c-cpp, python, actions
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - extern
              - build
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
