name: dev-builds-cleanup

# A closed pull request (merged or not) no longer needs its development build:
# removes its "pr-<n>" pre-release and tag (published by build.yml, job
# dev-builds), so Developer tools › Install another build stops listing it.
on:
  pull_request:
    types: [ closed ]

permissions:
  contents: read

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove the pull request's development build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh release view "pr-$PR" > /dev/null 2>&1; then
            gh release delete "pr-$PR" --cleanup-tag --yes
          else
            echo "no development build for #$PR"
          fi
