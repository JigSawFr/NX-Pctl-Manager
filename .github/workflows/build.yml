name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # Called by release-please.yml once a release (and its vX.Y.Z tag) exists.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach the assets to
        type: string
        required: true

permissions:
  contents: read

# A new push to a pull request cancels the run on the commit it replaces. Everything else
# (main, a release build called by release-please.yml) gets a group of its own and is
# never cancelled or held back by another run.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Fast checks with no toolchain: C service layer unit tests (under
  # AddressSanitizer and UndefinedBehaviorSanitizer) + resources.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true   # nlohmann/json (bundled with borealis) for the backup and export tests
      - name: Unit tests (service layer — writable and read-only — and UI-free helpers)
        run: make test
      - name: Resources (i18n keys, translations, XML layouts)
        run: python3 tools/check_resources.py .
      - name: Remote link documents (Home Assistant discovery, state)
        run: python3 tools/check_sync_json.py build/host-tests/sync
      - name: compat.json generator
        run: python3 tools/gen_compat.py . build/compat.json

  # Builds the UI on Linux against the simulated backend and clicks through
  # every screen headlessly: catches borealis XML / view errors without a console.
  desktop-smoke:
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true
      - name: Borealis GLFW fork
        run: git -C extern/borealis submodule update --init --depth 1 library/lib/extern/glfw
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ccache libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev wayland-protocols libdbus-1-dev \
            libcurl4-openssl-dev xvfb xdotool imagemagick dbus
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: ccache-desktop-${{ github.sha }}
          restore-keys: ccache-desktop-
      - name: Build (desktop simulation)
        run: make desktop && ccache --show-stats
      - name: Smoke test
        run: xvfb-run -s "-screen 0 1280x720x24" python3 tools/desktop_smoke.py smoke
      - name: Smoke test (firmware not supported yet, developer mode)
        run: xvfb-run -s "-screen 0 1280x720x24" python3 tools/desktop_smoke.py smoke-gate gate
      - name: Smoke test (limit reached, unlock refused, clock sync off)
        run: xvfb-run -s "-screen 0 1280x720x24" python3 tools/desktop_smoke.py smoke-errors errors
      - name: Smoke test (recovery screen from a rescue report)
        run: xvfb-run -s "-screen 0 1280x720x24" python3 tools/desktop_smoke.py smoke-rescue rescue
      - name: Smoke test (install a development build in place)
        run: xvfb-run -s "-screen 0 1280x720x24" python3 tools/desktop_smoke.py smoke-devbuild devbuild
      # The screens against tests/visual (reference | now | changes in
      # smoke*/visual_diff/ when one changed; tests/visual/README.md says how
      # to update the references after a change that is meant). Not blocking:
      # a screen that changed is a warning on the PR and in the job summary,
      # with the side-by-side images in the screenshots artifact; the smoke
      # test above is what fails the job.
      - name: Visual check (warning only)
        run: |
          for set in "smoke smoke" "smoke-errors errors" "smoke-gate gate"; do
            set -- $set
            if python3 tools/visual_check.py "$1" "tests/visual/$2" > "$1-visual.txt" 2>&1; then
              tail -n 1 "$1-visual.txt"
            else
              cat "$1-visual.txt"
              summary=$(grep '^visual check:' "$1-visual.txt" || echo "visual check failed")
              echo "::warning title=Visual check ($2)::$summary — see the desktop_smoke_screenshots artifact (visual_diff/)"
              { echo "### Visual check ($2)"; echo '```'; cat "$1-visual.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop_smoke_screenshots
          path: |
            smoke/*.png
            smoke-gate/*.png
            smoke-errors/*.png
            smoke-rescue/*.png
            smoke-devbuild/*.png
            smoke*/visual_diff/*.png

  # The real .nro, built in the official devkitPro image (same as ./run.sh),
  # and compat.json (what the app's update check reads from the latest release).
  # The image is pinned by digest so a release can be rebuilt with the same
  # toolchain; to move to a newer devkitPro, replace the digest (from
  # `docker buildx imagetools inspect devkitpro/devkita64:latest`) here and in
  # "Build identity" below.
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true
      - name: ccache
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ccache
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: ccache-switch-${{ github.sha }}
          restore-keys: ccache-switch-
      - name: Build .nro / .zip
        env:
          # The commit the app says it was built from (app::commit()): for a
          # pull request its head, as the artifacts API names the run, not the
          # merge commit checked out. Developer tools › Install another build
          # tells the installed build by it.
          PLAYGUARD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The checkout belongs to another user than the container's root: git
          # refuses it without this, and CMake reads the commit the app shows.
          git config --global --add safe.directory '*'
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          make dist
          # The optional recovery sysmodule, as its own asset (sysmodule/).
          make dist-rescue
          ccache --show-stats
          dkp-pacman -Q libnx switch-tools switch-curl switch-glfw switch-mesa > toolchain.txt 2>/dev/null || true
      - name: compat.json
        run: python3 tools/gen_compat.py . compat.json
      - name: Build identity
        run: |
          # actions/checkout marks the workspace safe only in a temporary HOME
          # during its own step; the checkout belongs to another user than the
          # container's root, so git refuses it here without this.
          git config --global --add safe.directory '*'
          {
            echo "commit: $(git rev-parse HEAD)"
            echo "image: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282"
            git submodule status
            cat toolchain.txt
          } > build-info.txt
          sha256sum playguard.nro playguard.zip playguard-rescue.zip compat.json > SHA256SUMS.txt
          cat build-info.txt
          unzip -l playguard.zip
          unzip -l playguard-rescue.zip
      # Two artifacts so the .nro is not in the same one twice (raw, and again
      # inside playguard.zip): playguard_release is what Developer tools ›
      # Install another build downloads on the console (source/util/dev_builds.hpp),
      # so it holds the raw .nro and the small text files only; the zips the
      # release attaches are in playguard_packages.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playguard_release
          path: |
            playguard.nro
            compat.json
            build-info.txt
            SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playguard_packages
          path: |
            playguard.zip
            playguard-rescue.zip
      - name: Linker map (what makes the .nro big)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playguard_linker_map
          path: build/borealis.map
          retention-days: 14

  # Only when called by release-please.yml: check the NACP version matches the
  # tag, then attach the assets to the release. The raw .nro is what sphaira's
  # GitHub updater downloads; the .zip is what the Homebrew App Store
  # (hb-appstore) picks up; compat.json is what PlayGuard's update check reads
  # (releases/latest/download/compat.json); build-info.txt names the commit,
  # the submodules and the toolchain the assets were built with.
  release:
    if: inputs.tag
    runs-on: ubuntu-latest
    needs: [ host-tests, switch, desktop-smoke ]
    permissions:
      contents: write
      # Build provenance (below): a signed statement, kept by GitHub, that these files
      # were built by this workflow from this commit.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
      - name: Tag matches the app version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          v=$(sed -n 's/^set(VERSION_\(MAJOR\|MINOR\|ALTER\) "\([0-9]*\)").*/\2/p' CMakeLists.txt | paste -sd.)
          test "v$v" = "$TAG" || { echo "tag $TAG != CMake version $v"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: playguard_release
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: playguard_packages
          path: dist
      # Anyone can then check that a download came from this repository's CI, unchanged:
      #   gh attestation verify playguard.nro -R JigSawFr/PlayGuard
      # SHA256SUMS.txt says the files match each other; this says who built them.
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/playguard.nro
            dist/playguard.zip
            dist/playguard-rescue.zip
            dist/compat.json
      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/playguard.nro
            dist/playguard.zip
            dist/playguard-rescue.zip
            dist/compat.json
            dist/build-info.txt
            dist/SHA256SUMS.txt
