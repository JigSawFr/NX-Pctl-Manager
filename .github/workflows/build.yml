name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # Called by release-please.yml once a release (and its vX.Y.Z tag) exists.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach the assets to
        type: string
        required: true

permissions:
  contents: read

# A new push to a pull request cancels the run on the commit it replaces. Everything else
# (main, a release build called by release-please.yml) gets a group of its own and is
# never cancelled or held back by another run.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Fast checks with no toolchain: C service layer unit tests (under
  # AddressSanitizer and UndefinedBehaviorSanitizer) + resources.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true   # nlohmann/json (bundled with borealis) for the backup and export tests
      - name: Unit tests (service layer — writable and read-only — and UI-free helpers)
        run: make test
      - name: Resources (i18n keys, translations, XML layouts)
        run: python3 tools/check_resources.py .
      - name: compat.json generator
        run: python3 tools/gen_compat.py . build/compat.json
      - name: Python tools compile
        run: python3 -m py_compile tools/*.py

  # The same host tests built by clang (other warnings, other sanitizer
  # runtime), then once more by gcc with --coverage for a line coverage
  # summary on the run page. The coverage is a report, not a gate.
  host-tests-clang-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Dependencies (clang's sanitizer runtime, gcovr)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-dev gcovr
      - name: Unit tests (clang)
        run: make test CC=clang CXX=clang++
      - name: Unit tests (gcc, coverage)
        # Without the sanitizers: their instrumentation skews the counts.
        run: make test SAN= COV=--coverage CC=gcc CXX=g++
      - name: Coverage summary
        run: |
          { echo "### Host test coverage (source/)"; echo '```'
            gcovr --root . --filter 'source/' --txt-summary build/host-tests
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Builds the UI on Linux against the simulated backend and clicks through
  # every screen headlessly: catches borealis XML / view errors without a console.
  # The scenarios run in parallel shards (under software GL the default one
  # alone takes over 3 minutes); each shard builds with the shared ccache
  # (about 12 s warm), and only the first saves it back. The desktop-smoke job
  # below gathers them under one name for the release job and branch rules.
  desktop-smoke-shard:
    name: desktop-smoke (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: default
            scenarios: smoke
          - shard: states
            scenarios: gate errors rescue forged lock
          - shard: developer
            scenarios: devbuild library outside
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true
      - name: Borealis GLFW fork
        run: git -C extern/borealis submodule update --init --depth 1 library/lib/extern/glfw
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ccache libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev wayland-protocols libdbus-1-dev \
            libcurl4-openssl-dev xvfb xdotool imagemagick dbus
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-desktop-${{ github.sha }}
          restore-keys: ccache-desktop-
      - name: Build (desktop simulation)
        run: make desktop CMAKE_ARGS=-DPLAYGUARD_WERROR=ON && ccache --show-stats
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.shard == 'default'
        with:
          path: .ccache
          key: ccache-desktop-${{ github.sha }}
      # Each scenario writes its screenshots to smoke/ (the default one) or
      # smoke-<scenario>/. Every scenario of the shard runs; the step fails at
      # the end if one did.
      - name: Smoke test (${{ matrix.scenarios }})
        env:
          SCENARIOS: ${{ matrix.scenarios }}
        run: |
          failed=""
          for sc in $SCENARIOS; do
            if [ "$sc" = smoke ]; then out=smoke; arg=""; else out="smoke-$sc"; arg="$sc"; fi
            echo "::group::$sc"
            xvfb-run -s "-screen 0 1280x720x24" python3 tools/desktop_smoke.py "$out" $arg || failed="$failed $sc"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error title=Smoke test::failed:$failed"; exit 1; fi
      # The screens against tests/visual/<scenario> (reference | now | changes
      # in smoke*/visual_diff/ when one changed; tests/visual/README.md says
      # how to update the references after a change that is meant). The
      # simulator draws the focus without its moving glow
      # (PLAYGUARD_SIM_STILL_FOCUS), so a screen comes out the same in every
      # run: one that changed fails the job, with the side-by-side images in
      # the shard's screenshots artifact and the details in the job summary.
      - name: Visual check
        env:
          SCENARIOS: ${{ matrix.scenarios }}
          ARTIFACT: desktop_smoke_screenshots_${{ matrix.shard }}
        run: |
          failed=""
          for sc in $SCENARIOS; do
            if [ "$sc" = smoke ]; then out=smoke; else out="smoke-$sc"; fi
            [ -d "tests/visual/$sc" ] || continue   # no references for this scenario
            if python3 tools/visual_check.py "$out" "tests/visual/$sc" > "$out-visual.txt" 2>&1; then
              tail -n 1 "$out-visual.txt"
            else
              cat "$out-visual.txt"
              summary=$(grep '^visual check:' "$out-visual.txt" || echo "visual check failed")
              echo "::error title=Visual check ($sc)::$summary — see the $ARTIFACT artifact (visual_diff/)"
              { echo "### Visual check ($sc)"; echo '```'; cat "$out-visual.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              failed="$failed $sc"
            fi
          done
          [ -z "$failed" ]
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop_smoke_screenshots_${{ matrix.shard }}
          path: |
            smoke*/*.png
            smoke*/visual_diff/*.png
          retention-days: 14

  # One result for the shards above, under the name the release job and the
  # branch rules wait for.
  desktop-smoke:
    if: ${{ !cancelled() }}
    needs: [ desktop-smoke-shard ]
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.desktop-smoke-shard.result }}
        run: test "$RESULT" = success

  # The real .nro, built in the official devkitPro image, and compat.json
  # (what the app's update check reads from the latest release).
  # The image is pinned by digest so a release can be rebuilt with the same
  # toolchain. The `image:` line below is the only place the digest is
  # written: "Build identity" and ./run.sh read it from this file. To move to
  # a newer devkitPro, replace it (from
  # `docker buildx imagetools inspect devkitpro/devkita64:latest`); the job
  # then checks that its libnx is still recent enough.
  # The image is pulled before any step runs, and Docker Hub's anonymous limit
  # (per runner IP, shared with every other job on it) can refuse it. With the
  # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets (a read-only access token)
  # the pull is made logged in; where secrets are missing (a fork's pull request,
  # Dependabot) it pulls anonymously as before. The workflow rejects an empty
  # username or password, so without both secrets credentials is an empty
  # mapping, and the runner skips the login when it has no username.
  switch:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
      credentials: ${{ (secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '') && fromJSON(format('{{"username":{0},"password":{1}}}', toJSON(secrets.DOCKERHUB_USERNAME), toJSON(secrets.DOCKERHUB_TOKEN))) || fromJSON('{}') }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true
      - name: ccache
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ccache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-switch-${{ github.sha }}
          restore-keys: ccache-switch-
      - name: Build .nro / .zip
        env:
          # The commit the app says it was built from (app::commit()): for a
          # pull request its head, as the artifacts API names the run, not the
          # merge commit checked out. Developer tools › Install another build
          # tells the installed build by it.
          PLAYGUARD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The checkout belongs to another user than the container's root: git
          # refuses it without this, and CMake reads the commit the app shows.
          git config --global --add safe.directory '*'
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          # PlayGuard's warnings as errors, as on the desktop: the libnx code
          # (source/core/*.c, the __SWITCH__ paths) is only built here.
          make dist CMAKE_ARGS=-DPLAYGUARD_WERROR=ON
          # The optional recovery sysmodule, as its own asset (sysmodule/).
          make dist-rescue
          ccache --show-stats
          # The same commit gives the same zips (CONTRIBUTING.md, "Reproducible
          # zips"): build them once more and compare.
          sha256sum playguard.zip playguard-rescue.zip > first-build.txt
          make dist CMAKE_ARGS=-DPLAYGUARD_WERROR=ON
          make dist-rescue
          sha256sum -c first-build.txt
      - name: Toolchain
        run: |
          dkp-pacman -Q devkitA64 libnx deko3d switch-tools switch-curl > toolchain.txt
          cat toolchain.txt
          # libnx 4.11.0 and 4.11.1 break recursive mutexes (newlib's stdio
          # and malloc locks), fixed in 4.12.0; before 4.10.0 the thread-local
          # storage clashes with 21.0.0 and later.
          libnx=$(sed -n 's/^libnx //p' toolchain.txt)
          if [ "$(printf '%s\n' 4.12.0 "${libnx%-*}" | sort -V | head -n 1)" != 4.12.0 ]; then
            echo "::error title=Toolchain::libnx $libnx is older than 4.12.0"
            exit 1
          fi
          # libnx's 21.0.0 marker (LNY2 after MOD0), which hbmenu checks.
          python3 tools/check_nro.py playguard.nro sysmodule/out/playguard-rescue.elf
      - name: compat.json
        run: python3 tools/gen_compat.py . compat.json
      - name: Build identity
        run: |
          # actions/checkout marks the workspace safe only in a temporary HOME
          # during its own step; the checkout belongs to another user than the
          # container's root, so git refuses it here without this.
          git config --global --add safe.directory '*'
          {
            echo "commit: $(git rev-parse HEAD)"
            echo "image: $(sed -n 's/^ *image: \(devkitpro\/devkita64@sha256:[0-9a-f]*\)$/\1/p' .github/workflows/build.yml)"
            git submodule status
            cat toolchain.txt
          } > build-info.txt
          sha256sum playguard.nro playguard.zip playguard-rescue.zip compat.json > SHA256SUMS.txt
          cat build-info.txt
          unzip -l playguard.zip
          unzip -l playguard-rescue.zip
      # Two artifacts so the .nro is not in the same one twice (raw, and again
      # inside playguard.zip): playguard_release is what Developer tools ›
      # Install another build downloads on the console (source/util/dev_builds.hpp),
      # so it holds the raw .nro and the small text files only; the zips the
      # release attaches are in playguard_packages.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playguard_release
          path: |
            playguard.nro
            compat.json
            build-info.txt
            SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playguard_packages
          path: |
            playguard.zip
            playguard-rescue.zip
      - name: Linker map (what makes the .nro big)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playguard_linker_map
          path: build/borealis.map
          retention-days: 14

  # Only when called by release-please.yml: check the NACP version matches the
  # tag, then attach the assets to the release. The raw .nro is what sphaira's
  # GitHub updater downloads; the .zip is what the Homebrew App Store
  # (hb-appstore) picks up; compat.json is what PlayGuard's update check reads
  # (releases/latest/download/compat.json); build-info.txt names the commit,
  # the submodules and the toolchain the assets were built with.
  release:
    if: inputs.tag
    runs-on: ubuntu-latest
    needs: [ host-tests, host-tests-clang-coverage, switch, desktop-smoke ]
    permissions:
      contents: write
      # Build provenance (below): a signed statement, kept by GitHub, that these files
      # were built by this workflow from this commit.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Tag matches the app version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          v=$(sed -n 's/^set(VERSION_\(MAJOR\|MINOR\|ALTER\) "\([0-9]*\)").*/\2/p' CMakeLists.txt | paste -sd.)
          test "v$v" = "$TAG" || { echo "tag $TAG != CMake version $v"; exit 1; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playguard_release
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playguard_packages
          path: dist
      # Anyone can then check that a download came from this repository's CI, unchanged:
      #   gh attestation verify playguard.nro -R JigSawFr/PlayGuard
      # SHA256SUMS.txt says the files match each other; this says who built them.
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/playguard.nro
            dist/playguard.zip
            dist/playguard-rescue.zip
            dist/compat.json
      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/playguard.nro
            dist/playguard.zip
            dist/playguard-rescue.zip
            dist/compat.json
            dist/build-info.txt
            dist/SHA256SUMS.txt
