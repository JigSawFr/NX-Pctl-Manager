name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # Called by release-please.yml once a release (and its vX.Y.Z tag) exists.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach the assets to
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Fast checks with no toolchain: C service layer unit tests + resources.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # nlohmann/json (bundled with borealis) for the backup tests
      - name: Unit tests (service layer — writable and READ_ONLY — and UI-free helpers)
        run: make test
      - name: Resources (i18n keys, translations, XML layouts)
        run: python3 tools/check_resources.py .

  # Builds the UI on Linux against the simulated backend and clicks through
  # every screen headlessly: catches borealis XML / view errors without a console.
  desktop-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true
      - name: Borealis GLFW fork
        run: git -C extern/borealis submodule update --init --depth 1 library/lib/extern/glfw
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev wayland-protocols libdbus-1-dev \
            xvfb xdotool imagemagick dbus
      - name: Build (desktop simulation)
        run: make desktop
      - name: Smoke test
        run: xvfb-run -s "-screen 0 1280x720x24" python3 tools/desktop_smoke.py smoke
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop_smoke_screenshots
          path: smoke/*.png

  # The real .nro, built in the official devkitPro image (same as ./run.sh).
  switch:
    runs-on: ubuntu-latest
    needs: host-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            flags: ""
          - variant: probe
            flags: "PROBE=1"
          - variant: readonly
            flags: "READ_ONLY=1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true
      - name: Build .nro / .zip (devkitpro/devkita64)
        run: docker run --rm -v "$PWD:/project" -w /project devkitpro/devkita64 sh -c "make dist ${{ matrix.flags }} && (dkp-pacman -Q libnx switch-tools 2>/dev/null || true) > toolchain.txt"
      - name: Build identity
        run: |
          {
            echo "commit: $(git rev-parse HEAD)"
            echo "variant: ${{ matrix.variant }} ${{ matrix.flags }}"
            git submodule status
            cat toolchain.txt
          } > build-info.txt
          sha256sum playguard.nro playguard.zip > SHA256SUMS.txt
          unzip -l playguard.zip
      - uses: actions/upload-artifact@v4
        with:
          name: playguard_${{ matrix.variant }}
          path: |
            playguard.nro
            playguard.zip
            build-info.txt
            SHA256SUMS.txt

  # Only when called by release-please.yml: check the NACP version matches the
  # tag, then attach the assets to the release. The raw .nro is what sphaira's
  # GitHub updater downloads; the .zip is what the Homebrew App Store
  # (hb-appstore) picks up.
  release:
    if: inputs.tag
    runs-on: ubuntu-latest
    needs: [ switch, desktop-smoke ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Tag matches the app version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          v=$(sed -n 's/^set(VERSION_\(MAJOR\|MINOR\|ALTER\) "\([0-9]*\)").*/\2/p' CMakeLists.txt | paste -sd.)
          test "v$v" = "$TAG" || { echo "tag $TAG != CMake version $v"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: playguard_release
          path: dist
      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/playguard.nro
            dist/playguard.zip
            dist/SHA256SUMS.txt
